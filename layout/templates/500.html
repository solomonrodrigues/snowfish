{% extends 'base.html' %}
{% load static %}

{% block title %}
    <title>500 Error - Internal Server Error</title>
{% endblock title %}

{% block head_scripts %}
    <!-- Google Font - Montserrat -->
    <link rel="preconnect" href="https://fonts.gstatic.com">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700&display=swap" rel="stylesheet">

    <style>
        body {
            background-color: #08090d;
            color: #ffffff;
            font-family: 'Montserrat', sans-serif !important;
            text-align: center;
            padding: 50px;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
        }

        .error-container {
            max-width: 600px;
            margin: 0 auto;
        }

        .error-heading {
            font-weight: 700;
            font-size: 6rem;
            margin-bottom: 20px;
            color: #ff6b6b; /* Light blue color for emphasis */
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.2); /* Add subtle text shadow */
        }

        .error-message {
            font-size: 1.5rem;
            margin-bottom: 30px;
            opacity: 0.8; /* Slightly reduce opacity for a subtle effect */
            line-height: 1.6; /* Improved readability with increased line height */
        }

        .error-image {
            max-width: 100%;
            max-height: 400px;
            height: auto;
            border-radius: 12px; /* Increased border radius for a smoother look */
            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.2); /* Add a more pronounced box shadow for depth */
        }

        .back-home {
            color: #ffffff;
            text-decoration: none;
            font-weight: bold;
            font-size: 1.2rem;
            background-color: #61dafb; /* Vibrant blue background color */
            padding: 12px 24px;
            border-radius: 6px; /* Slightly rounded corners for the button */
            transition: background-color 0.3s ease; /* Smooth transition on hover */
            display: inline-block;
            margin-top: 20px;
            text-transform: uppercase; /* Uppercase text for added style */
        }

        .back-home:hover {
            background-color: #4fa3d1; /* Darker blue on hover */
        }

        .sad-cat-source {
            font-size: 0.8rem;
            color: #ccc;
            opacity: 0.7;
            margin-top: 10px;
        }
    </style>
{% endblock %}

{% block body %}
<body>
    <div class="error-container">
        <h1 class="error-heading">500</h1>
        <p class="error-message">Oops! Something went wrong on our server. Please try again later.</p>
        <img src="https://cataas.com/cat/sad" alt="Sad Cat - Internal Server Error" class="error-image">
        <p class="sad-cat-source">Image source: <a href="https://cataas.com/" target="_blank" style="color: #ccc; text-decoration: underline;">Cataas</a></p>
        <p><a href="/" class="back-home">Back to Home</a></p>
    </div>
</body>
{% endblock %}

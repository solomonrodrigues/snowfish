{% load static %}

<!DOCTYPE html>
<html lang="en">
    <head>
        <title>Snowfish Official Website</title>
        <meta charset="UTF-8">
        <meta name="description" content="The official Snowfish website. Featuring news, videos, music, upcoming events, and merchandise.">
        <meta name="author" content="Solomon Rodrigues">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
        <link rel="stylesheet" type="text/css" href="{% static 'layout/css/styles.css' %}"/>
        <link rel="apple-touch-icon" sizes="180x180" href="{% static 'layout/favicon_io/apple-touch-icon.png' %}">
        <link rel="icon" type="image/png" sizes="32x32" href="{% static 'layout/favicon_io/favicon-32x32.png' %}">
        <link rel="icon" type="image/png" sizes="16x16" href="{% static 'layout/favicon_io/favicon-16x16.png' %}">
        <link rel="manifest" href="{% static 'layout/favicon_io/site.webmanifest' %}">
        {% block head_scripts %}
        {% endblock head_scripts %}
    </head>

    <body>
<!--        <div class="bg-dark-navy text-white">-->
        <div class="wrapper"> <!-- do we need these? wrapper, content-page, content?? -->
            <div class="content-page">
                <header role="banner" id="top" class="d-flex justify-content-center">
                  <div class="col-lg-10 d-flex justify-content-between align-items-center">
                    <a href="{% url 'home' %}" class="logo ms-3"></a>
                    <nav class="d-flex justify-content-end nav">
                          <a href="{% url 'news' %}" class="nav-link {% if request.path == '/news/' %}active{% endif %}">News</a>
                          <a href="{% url 'tour' %}" class="nav-link {% if request.path == '/tour/' %}active{% endif %}">Tour</a>
                          <a href="#" class="nav-link">Videos</a>
                          <a href="#" class="nav-link">Music</a>
                          <a href="#" class="nav-link">Photos</a>
                          <a href="#" class="nav-link">Merch</a>
                          <a href="#" class="nav-link">Connect</a>
                    </nav>
                  </div>
                </header>
                <main class="content">
                {% block content %}
                {% endblock content %}
                </main>
                <footer role="footer" class="d-flex justify-content-center">
                  <div class="footer-contents col-lg-10">
                      <ul class="footer-social col-6 justify-content-between">
                          <li>
                              <a class="facebook" href="https://www.facebook.com/snowfishband"></a>
                          </li>
                          <li>
                            <a class="twitter" href="https://twitter.com/snowfishband"></a>
                          </li>
                          <li>
                              <a class="instagram" href="https://www.instagram.com/snowfishband"></a>
                          </li>
                          <li>
                            <a class="youtube" href="https://www.youtube.com/channel/UCOpdjKHcrFKGOerZPavIxWw"></a>
                          </li>
                          <li>
                            <a class="tiktok" href="https://www.tiktok.com/@snowfishband"></a>
                          </li>
                          <li>
                            <a class="spotify" href="https://open.spotify.com/artist/0NDdFWfIaf38Lrq3KAPADJ?si=gg2b_ZWPQfOmi4rPLL3zDA"></a>
                          </li>
                          <li>
                            <a class="apple-music" href="https://music.apple.com/au/artist/snowfish/1527036175"></a>
                          </li>
                      </ul>
                      <div class="footer-text">
                          <p>©<span id="currentYear"></span> Snowfish</p>
                      </div>
                  </div>
                </footer>
                <script src="./static/layout/js/sticky-nav.js"></script>
                {% block body_scripts %}
                {% endblock body_scripts %}
            </div>
        </div>
    </body>
</html>

{% block extra_javascript %}
<script>
  document.getElementById('currentYear').textContent = new Date().getFullYear();
</script>
{% endblock %}

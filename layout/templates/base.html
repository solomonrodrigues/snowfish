{% load static %}

<!DOCTYPE html>
<html lang="en">
    <head>
        <title>Snowfish Official Website</title>
        <meta charset="UTF-8">
        <meta name="description" content="The official Snowfish website. Featuring news, videos, music, upcoming events, and merchandise.">
        <meta name="author" content="Solomon Rodrigues">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
<!--        <link rel="stylesheet" type="text/css" href="{% static 'layout/css/bootstrap.css' %}"/>-->
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
        <link rel="stylesheet" type="text/css" href="{% static 'layout/css/styles.css' %}"/>
        {% block head_scripts %}
        {% endblock head_scripts %}
    </head>

    <body>
        <div class="bg-dark-navy text-white">
            <header role="banner" id="top" class="d-flex justify-content-center">
              <div class="col-lg-10 d-flex justify-content-between align-items-center">
                <a href="{% url 'home' %}" class="logo ms-3"></a>
                <nav class="d-flex justify-content-end nav">
                      <a href="#" class="nav-link">News</a>
                      <a href="{% url 'tour' %}" class="nav-link {% if request.path == '/tour/' %}active{% endif %}">Tour</a>
                      <a href="#" class="nav-link">Videos</a>
                      <a href="#" class="nav-link">Music</a>
                      <a href="#" class="nav-link">Photos</a>
                      <a href="#" class="nav-link">Merch</a>
                      <a href="#" class="nav-link">Connect</a>
                </nav>
              </div>
            </header>
            {% block content %}
            {% endblock content %}
            <footer role="footer" class="container-fluid text-center">
              <div>
                <p>Footer Text</p>
              </div>
            </footer>
            <script src="./static/layout/js/sticky-nav.js"></script>
            {% block body_scripts %}
            {% endblock body_scripts %}
        </div>
    </body>
</html>

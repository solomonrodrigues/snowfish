{% load static %}

<!DOCTYPE html>
<html lang="en">
<head>
    <title>{% block title %}Snowfish Official Website{% endblock %}</title>
    <meta charset="UTF-8">
    <meta name="description" content="The official Snowfish website. Explore our blog, watch videos, listen to music, check out upcoming events, and shop our merchandise.">
    <meta name="author" content="Solomon Rodrigues">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Canonical tag -->
    <link rel="canonical" href="https://www.snowfish.com.au{{ request.path }}" />

    <!-- Open Graph meta tags -->
    <meta property="og:title" content="{% block og_title %}Snowfish Official Website{% endblock %}" />
    <meta property="og:description" content="{% block og_description %}The official Snowfish website. Explore our blog, watch videos, listen to music, check out upcoming events, and shop our merchandise.{% endblock %}" />
    <meta property="og:image" content="{% block og_image %}https://www.snowfish.com.au/static/layout/img/og-snowfish.webp{% endblock %}" />
    <meta property="og:url" content="https://www.snowfish.com.au{{ request.path }}" />
    <meta property="og:type" content="website" />

    <!--structured data using JSON-LD.-->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "MusicGroup",
      "name": "Snowfish",
      "url": "https://www.snowfish.com.au",
      "sameAs": [
        "https://www.facebook.com/snowfishband",
        "https://www.instagram.com/snowfishmusic",
        "https://twitter.com/snowfishband"
      ]
    }
    </script>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">

    <!-- Custom CSS -->
    <link rel="stylesheet" type="text/css" href="{% static 'layout/css/styles.css' %}">

    <!-- Favicon -->
    <link rel="apple-touch-icon" sizes="180x180" href="{% static 'layout/favicon_io/apple-touch-icon.png' %}">
    <link rel="icon" type="image/png" sizes="32x32" href="{% static 'layout/favicon_io/favicon-32x32.png' %}">
    <link rel="icon" type="image/png" sizes="16x16" href="{% static 'layout/favicon_io/favicon-16x16.png' %}">
    <link rel="manifest" href="{% static 'layout/favicon_io/site.webmanifest' %}">

    {% block head_scripts %}
    {% endblock head_scripts %}
</head>
    {% block body %}
    {% endblock %}
</html>

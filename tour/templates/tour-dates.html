{% extends 'base.html' %}
{% load static %}

{% block content %}

<div class="row">
  <div class="d-flex justify-content-center align-items-center">
    <div class="p-lg-5 p-4 col-lg-10 col-12">

      <h1 class="text-left">TOUR DATES</h1>

      <div class="mt-5">
        <ol id="tour-dates-list" class="tour-dates-list">
          {% for date in tour_dates %}
<!--          <li>-->
<!--            <div class="tour-date-item">-->
<!--              <h5>{{ date.date }}</h5>-->
<!--              <p>{{ date.city }}, {{ date.country }}</p>-->
<!--              <p class="text-secondary">{{ date.venue }}</p>-->
<!--            </div>-->
<!--          </li>-->
          <li>
            <div class="col-sm-6">
              <div class="card bg-dark border-light mb-3">
                <div class="card-header">
                  <h5 class="card-title my-1">{{ date.date }}</h5>
                </div>
                <div class="card-body">
                  <p class="card-text">{{ date.city }}, {{ date.country }}</p>
                  <div class="d-flex justify-content-between align-items-center">
                    <p class="card-text text-secondary">{{ date.venue }}</p>
                    <a class="btn btn-secondary" href="{% url 'tour-date' date.slug %}">View</a>
                  </div>
                </div>
              </div>
            </div>
          </li>
          {% endfor %}
        </ol>
      </div>

    </div>
  </div>
</div>

{% endblock %}

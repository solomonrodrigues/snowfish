{% extends 'base.html' %}
{% load static %}

{% block content %}

<div class="py-sm-5 py-3 px-5 px-2">

  <h1 class="text-left">TOUR DATES</h1>

  <div class="d-flex justify-content-center my-5">
    <ol id="tour-dates-list" class="tour-dates-list">
      {% for tour_date in tour_dates %}
      <li>
        <div>
          <h5>{{ tour_date.date }}</h5>
          <p>{{ tour_date.city }}</p>
          <p>{{ tour_date.venue }}</p>
        </div>
      </li>
      {% endfor %}
    </ol>
  </div>

</div>

{% endblock %}

{% extends 'base.html' %}
{% load static %}

{% block content %}

<div class="row">
  <div class="d-flex justify-content-center align-items-center">
    <div class="p-lg-5 p-4 col-lg-10 col-12">

      <h1 class="text-left">TOUR DATES</h1>

      <div class="mt-5">
        <ol id="tour-dates-list" class="tour-dates-list">
          {% for date in tour_dates %}
          <li>
            <div class="mb-3">
              <h5>{{ date.date }}</h5>
              <p>{{ date.city }}, {{ date.country }}</p>
              <p class="text-secondary">{{ date.venue }}</p>
            </div>
          </li>
          {% endfor %}
        </ol>
      </div>

    </div>
  </div>
</div>

{% endblock %}

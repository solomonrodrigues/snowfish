{% extends 'fullbase.html' %}
{% load static %}

{% block title %}Snowfish | Music{% endblock %}
{% block og-title %}Snowfish | Music{% endblock %}

{% block content %}

<div class="row">
  <div class="d-flex justify-content-center align-items-center">
    <div class="py-lg-5 py-4 col-10">

      <h1 class="text-left">Music</h1>

      <div class="mt-5">

        {% for release in releases %}
          {% include '_release.html' with release=release forloop=forloop %}
        {% endfor %}

      </div>

    </div>
  </div>
</div>

{% endblock %}

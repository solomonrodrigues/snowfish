{% extends 'base.html' %}
{% load static %}

{% block title %}
    <title>Snowfish | Music</title>
{% endblock title %}

{% block content %}

<div class="row">
  <div class="d-flex justify-content-center align-items-center">
    <div class="p-lg-5 p-4 col-lg-10 col-12">

      <h1 class="text-left">MUSIC</h1>

      <div class="mt-5">
        <hr>
        <div class="row release">
          <div class="packshot col-6">
              <img src="{% static 'layout/img/the_monster_upstairs.png' %}" alt="The Monster Upstairs" width="400">
          </div>
          <div class="info col-6 d-flex justify-content-center flex-column">
            <h2>The Monster Upstairs</h2>
            <div class="release-meta">
              <div class="release-date">
                <span class="subtitle">Release date:</span>
                25 November 2022
              </div>
            </div>
            <div class="retail-links">
              <a href="https://gyro.to/TheMonsterUpstairs" class="btn">
                  <button class="custom-button" role="button"><span class="text">Listen Now</span></button>
              </a>
            </div>
          </div>
        </div>
        <hr >
      </div>

    </div>
  </div>
</div>

{% endblock %}

{% extends 'fullbase.html' %}
{% load static %}

{% block title %}
    <title>Snowfish | Photos</title>
{% endblock title %}

{% block head_scripts %}
    <!-- Bootstrap JavaScript -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.min.js" integrity="sha384-cVKIPhGWiC2Al4u+LWgxfKTRIcfu0JTxR+EQDz/bgldoEyl4H0zUF0QKbrJ0EcQF" crossorigin="anonymous"></script>
{% endblock %}

{% block content %}

<div class="row">
  <div class="d-flex justify-content-center align-items-center">
    <div class="p-lg-5 p-4 col-lg-10 col-12">

      <img src="{% static 'layout/img/snowfish-logo-white.svg' %}" alt="Snowfish logo">
      <h1 class="text-left">PHOTO GALLERY</h1>

      <div class="mt-5">
        <h2>2023</h2>

        <div id="carousel-2023" class="carousel slide" data-bs-ride="carousel" data-bs-interval="false"> <!--turn off automatic cycling-->
          <div class="carousel-inner">
            <div class="carousel-item active">
              <img src="{% static 'layout/img/gallery/2023-1.webp' %}" alt="Snowfish 2023 1" class="d-block">
            </div>
            <div class="carousel-item">
              <img src="{% static 'layout/img/gallery/2023-2.webp' %}" alt="Snowfish 2023 2" class="d-block">
            </div>
            <div class="carousel-item">
              <img src="{% static 'layout/img/gallery/2023-3.webp' %}" alt="Snowfish 2023 3" class="d-block">
            </div>
            <div class="carousel-item">
              <img src="{% static 'layout/img/gallery/2023-4.webp' %}" alt="Snowfish 2023 3" class="d-block">
            </div>
          </div>
          <button class="carousel-control-prev" type="button" data-bs-target="#carousel-2023" data-bs-slide="prev">
            <span class="carousel-control-prev-icon" aria-hidden="true"></span>
            <span class="visually-hidden">Previous</span>
          </button>
          <button class="carousel-control-next" type="button" data-bs-target="#carousel-2023" data-bs-slide="next">
            <span class="carousel-control-next-icon" aria-hidden="true"></span>
            <span class="visually-hidden">Next</span>
          </button>
        </div>

        <h2>2022</h2>

        <div id="carousel-2022" class="carousel slide" data-bs-ride="carousel" data-bs-interval="false"> <!--turn off automatic cycling-->
          <div class="carousel-inner">
            <div class="carousel-item active">
              <img src="{% static 'layout/img/gallery/2022-1.webp' %}" alt="Snowfish 2022 1" class="d-block">
            </div>
            <div class="carousel-item">
              <img src="{% static 'layout/img/gallery/2022-2.webp' %}" alt="Snowfish 2022 2" class="d-block">
            </div>
            <div class="carousel-item">
              <img src="{% static 'layout/img/gallery/2022-3.webp' %}" alt="Snowfish 2022 3" class="d-block">
            </div>
          </div>
          <button class="carousel-control-prev" type="button" data-bs-target="#carousel-2022" data-bs-slide="prev">
            <span class="carousel-control-prev-icon" aria-hidden="true"></span>
            <span class="visually-hidden">Previous</span>
          </button>
          <button class="carousel-control-next" type="button" data-bs-target="#carousel-2022" data-bs-slide="next">
            <span class="carousel-control-next-icon" aria-hidden="true"></span>
            <span class="visually-hidden">Next</span>
          </button>
        </div>

        <h2>2021</h2>

        <div>
          <img src="{% static 'layout/img/gallery/2021-1.webp' %}" alt="Snowfish in 2021" width="100%">
        </div>

        <h2>2019</h2>

        <div id="carousel-2019" class="carousel slide" data-bs-ride="carousel" data-bs-interval="false"> <!--turn off automatic cycling-->
          <div class="carousel-inner">
            <div class="carousel-item active">
              <img src="{% static 'layout/img/gallery/2019-1.webp' %}" alt="Snowfish 2019 1" class="d-block">
            </div>
            <div class="carousel-item">
              <img src="{% static 'layout/img/gallery/2019-2.webp' %}" alt="Snowfish 2019 2" class="d-block">
            </div>
          </div>
          <button class="carousel-control-prev" type="button" data-bs-target="#carousel-2019" data-bs-slide="prev">
            <span class="carousel-control-prev-icon" aria-hidden="true"></span>
            <span class="visually-hidden">Previous</span>
          </button>
          <button class="carousel-control-next" type="button" data-bs-target="#carousel-2019" data-bs-slide="next">
            <span class="carousel-control-next-icon" aria-hidden="true"></span>
            <span class="visually-hidden">Next</span>
          </button>
        </div>

      </div>

    </div>
  </div>
</div>

{% endblock %}

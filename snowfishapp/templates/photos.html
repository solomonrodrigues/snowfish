{% extends 'base.html' %}
{% load static %}

{% block title %}
    <title>Snowfish | Photos</title>
{% endblock title %}

{% block content %}

<div class="row">
  <div class="d-flex justify-content-center align-items-center">
    <div class="p-lg-5 p-4 col-lg-10 col-12">

      <img src="{% static 'layout/img/snowfish-logo-white.svg' %}" alt="Snowfish logo">
      <h1 class="text-left">PHOTO GALLERY</h1>

      <div class="mt-5">
        <h2>2023</h2>

        <div id="carouselExampleControls" class="carousel slide" data-bs-ride="carousel">
          <div class="carousel-inner">
            <div class="carousel-item active">
              <img src="{% static 'layout/img/gallery/2023-1.webp' %}" alt="Snowfish 2023 1" class="d-block w-100">
            </div>
            <div class="carousel-item">
              <img src="{% static 'layout/img/gallery/2023-2.webp' %}" alt="Snowfish 2023 2" class="d-block w-100">
            </div>
            <div class="carousel-item">
              <img src="{% static 'layout/img/gallery/2023-3.webp' %}" alt="Snowfish 2023 3" class="d-block w-100">
            </div>
            <div class="carousel-item">
              <img src="{% static 'layout/img/gallery/2023-4.webp' %}" alt="Snowfish 2023 3" class="d-block w-100">
            </div>
          </div>
          <button class="carousel-control-prev" type="button" data-bs-target="#carouselExampleControls" data-bs-slide="prev">
            <span class="carousel-control-prev-icon" aria-hidden="true"></span>
            <span class="visually-hidden">Previous</span>
          </button>
          <button class="carousel-control-next" type="button" data-bs-target="#carouselExampleControls" data-bs-slide="next">
            <span class="carousel-control-next-icon" aria-hidden="true"></span>
            <span class="visually-hidden">Next</span>
          </button>
        </div>

        <h2>2022</h2>
        <div>
          <img src="{% static 'layout/img/gallery/2022.webp' %}" alt="Snowfish in 2022" width="100%">
        </div>
        <h2>2021</h2>
        <div>
          <img src="{% static 'layout/img/gallery/2021.webp' %}" alt="Snowfish in 2021" width="100%">
        </div>
        <h2>2019</h2>
        <div>
          <img src="{% static 'layout/img/gallery/2019.webp' %}" alt="Snowfish in 2019" width="100%">
        </div>
      </div>

    </div>
  </div>
</div>

{% endblock %}

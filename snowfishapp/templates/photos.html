{% extends 'base.html' %}
{% load static %}

{% block title %}
    <title>Snowfish | Photos</title>
{% endblock title %}

{% block content %}

<div class="row">
  <div class="d-flex justify-content-center align-items-center">
    <div class="p-lg-5 p-4 col-lg-10 col-12">

      <img src="{% static 'layout/img/snowfish-logo-white.svg' %}" alt="Snowfish logo">
      <h1 class="text-left">PHOTO GALLERY</h1>

      <div class="mt-5">
        <h2>2023</h2>
        <div>
          <img src="{% static 'layout/img/gallery/2023.webp' %}" alt="Snowfish in 2023" width="100%">
        </div>
        <h2>2022</h2>
        <div>
          <img src="{% static 'layout/img/gallery/2022.webp' %}" alt="Snowfish in 2022" width="100%">
        </div>
        <h2>2021</h2>
        <div>
          <img src="{% static 'layout/img/gallery/2021.webp' %}" alt="Snowfish in 2021" width="100%">
        </div>
        <h2>2019</h2>
        <div>
          <img src="{% static 'layout/img/gallery/2019.webp' %}" alt="Snowfish in 2019" width="100%">
        </div>
      </div>

    </div>
  </div>
</div>

{% endblock %}
